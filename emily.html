<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<!-- 關鍵：確保手機端維持 1:1 縮放比例 -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>艾蜜莉兒</title>
		<link rel="stylesheet" href="index.css" >
	</head>
	<body>
		<!-- 外層最大容器 -->
		<div class="wrap">
			<!-- 包裹所有元素的容器 -->
			<div class="cube">
				<!-- 前圖片 -->
				<div class="out_front">
					<img src="https://i.imgur.com/g9AVmc7.jpg"  class="pic"/>
				</div>
				<!-- 後圖片 -->
				<div class="out_back">
					<img src="https://i.imgur.com/sCx7EsQ.jpg"  class="pic"/>
				</div>
				<!-- 左圖片 -->
				<div class="out_left">
					<img src="https://i.imgur.com/8WDQcpT.jpg"  class="pic"/>
				</div>
				<!-- 右圖片 -->
				<div class="out_right">
					<img src="https://i.imgur.com/bciTI1z.jpg"  class="pic"/>
				</div>
				<!-- 上圖片 -->
				<div class="out_top">
					<img src="https://i.imgur.com/yCZ2EY0.jpg"  class="pic"/>
				</div>
				<!-- 下圖片 -->
				<div class="out_bottom">
					<img src="https://i.imgur.com/hFudmLI.jpg"  class="pic"/>
				</div>
				<!-- 小正方體 --> 
				<span class="in_front">
					<img src="https://i.imgur.com/UhjegnX.jpg" class="in_pic" />
				</span>
				<span class="in_back">
					 <img src="https://i.imgur.com/O1817JD.jpg" class="in_pic" />
				</span>
				<span class="in_left">
					<img src="https://i.imgur.com/H9uar3A.jpg" class="in_pic" />
				</span>
				<span class="in_right">
					<img src="https://i.imgur.com/iazIvju.jpg" class="in_pic" />
				</span>
				<span class="in_top">
					<img src="https://i.imgur.com/EHeBCUI.jpg" class="in_pic" />
				</span>
				<span class="in_bottom">
					<img src="https://i.imgur.com/xI5JI3Z.jpg" class="in_pic" />
				</span>
			</div>
		</div>
	</body>
</html>
