<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<!-- 確保手機端維持 1:1 縮放比例，防止畫面移位 -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<title>艾蜜莉兒</title>
		<link rel="stylesheet" href="index.css" >
	</head>
	<body>
		<!-- 外層最大容器 -->
		<div class="wrap">
			<!-- 包裹所有元素的容器 -->
			<div class="cube">
				<!-- 前圖片 -->
				<div class="out_front">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 後圖片 -->
				<div class="out_back">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 左圖片 -->
				<div class="out_left">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 右圖片 -->
				<div class="out_right">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 上圖片 -->
				<div class="out_top">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 下圖片 -->
				<div class="out_bottom">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 小正方體 --> 
				<span class="in_front">
					<img src="https://imgur.com" class="in_pic" />
				</span>
				<span class="in_back">
					 <img src="https://imgur.com" class="in_pic" />
				</span>
				<span class="in_left">
					<img src="https://imgur.com" class="in_pic" />
				</span>
				<span class="in_right">
					<img src="https://imgur.com" class="in_pic" />
				</span>
				<span class="in_top">
					<img src="https://imgur.com" class="in_pic" />
				</span>
				<span class="in_bottom">
					<img src="https://imgur.com" class="in_pic" />
				</span>
			</div>
		</div>

		<!-- ─── 終極修正：利用 JavaScript 強制全面封鎖手機長按跳出選單與拖拽事件 ─── -->
		<script>
			// 封鎖右鍵/長按選單
			window.addEventListener('contextmenu', function(e) { 
				e.preventDefault(); 
			}, { passive: false });

			// 封鎖手機圖片拖拽與長按原生放大功能
			window.addEventListener('touchstart', function(e) {
				if (e.target.tagName === 'IMG') {
					// 允許觸控觸發動畫，但阻止原生選單
					e.stopPropagation();
				}
			}, { passive: true });
		</script>
	</body>
</html>
