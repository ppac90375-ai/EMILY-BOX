<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<!-- 確保手機端維持 1:1 縮放比例 -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>艾蜜莉兒</title>
		<link rel="stylesheet" href="index.css" >
	</head>
	<body>
		<!-- 外層最大容器 -->
		<div class="wrap">
			<!-- 包裹所有元素的容器 -->
			<div class="cube">
				<!-- 前圖片 -->
				<div class="out_front">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 後圖片 -->
				<div class="out_back">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 左圖片 -->
				<div class="out_left">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 右圖片 -->
				<div class="out_right">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 上圖片 -->
				<div class="out_top">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 下圖片 -->
				<div class="out_bottom">
					<img src="https://imgur.com"  class="pic"/>
				</div>
				<!-- 小正方體 --> 
				<span class="in_front">
					<img src="https://imgur.com" class="in_pic" />
				</span>
				<span class="in_back">
					 <img src="https://imgur.com" class="in_pic" />
				</span>
				<span class="in_left">
					<img src="https://imgur.com" class="in_pic" />
				</span>
				<span class="in_right">
					<img src="https://imgur.com" class="in_pic" />
				</span>
				<span class="in_top">
					<img src="https://imgur.com" class="in_pic" />
				</span>
				<span class="in_bottom">
					<img src="https://imgur.com" class="in_pic" />
				</span>
			</div>
		</div>

		<!-- ─── 安全修正：只封鎖右鍵選單，絕對不影響圖片下載 ─── -->
		<script>
			// 僅阻止長按跳出選單的預設行為，觸控流暢度完全保留
			window.oncontextmenu = function(e) {
				e.preventDefault();
				return false;
			};
		</script>
	</body>
</html>
